name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  upload:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        run: |
          git init
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout "${GITHUB_SHA}"

      - name: Unlock keychain
        run: security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" ~/Library/Keychains/login.keychain-db

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/testflight.sh
